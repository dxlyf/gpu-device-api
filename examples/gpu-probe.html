<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>webgpu probe</title>
  </head>
  <body>
    <canvas id="view" width="64" height="64"></canvas>
    <pre id="log"></pre>
    <script>
      // 临时探测页：看当前命令行开关下能不能拿到 WebGPU adapter。
      const log = (m) => {
        document.getElementById('log').textContent += m + '\n';
      };
      (async () => {
        const root = document.documentElement;
        try {
          if (!navigator.gpu) {
            root.dataset.gpu = 'navigator.gpu-missing';
            log('navigator.gpu 不存在');
            return;
          }
          log('navigator.gpu 存在');
          const adapter = await navigator.gpu.requestAdapter();
          if (!adapter) {
            root.dataset.gpu = 'adapter-null';
            log('requestAdapter() = null');
            return;
          }
          root.dataset.gpu = 'adapter-ok';
          log('adapter.info = ' + JSON.stringify(adapter.info ?? {}));
          const device = await adapter.requestDevice();
          root.dataset.gpuDevice = 'device-ok';
          log('device ok');
          device.destroy();
        } catch (e) {
          root.dataset.gpu = 'error';
          log('异常：' + String(e));
        }
      })();
    </script>
  </body>
</html>
