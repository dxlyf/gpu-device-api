<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>gfx debug</title>
    <script>
      // 临时调试页：把脚本错误写到 DOM 上，便于 --dump-dom 抓取。
      window.addEventListener('error', (event) => {
        document.documentElement.dataset.gfxDebugError = String(event.message);
      });
      window.addEventListener('unhandledrejection', (event) => {
        document.documentElement.dataset.gfxDebugRejection = String(event.reason);
      });
    </script>
  </head>
  <body>
    <canvas id="view" width="320" height="320"></canvas>
    <pre id="log"></pre>
    <script type="module" src="./gfx-debug.ts"></script>
  </body>
</html>
