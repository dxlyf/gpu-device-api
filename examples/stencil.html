<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>gpu-device-api 模板（stencil）语义双后端对照页</title>
    <style>
      /* canvas 必须贴在左上角且尺寸精确，截图才能按 0,0,256,256 无偏差裁剪。 */
      html, body { margin: 0; padding: 0; background: #0b0e13; }
      canvas { display: block; margin: 0; padding: 0; width: 256px; height: 256px; }
      pre {
        font-family: ui-monospace, monospace; color: #d7dde5; background: #0b0e13;
        margin: 0; padding: 8px 12px; font-size: 12px; line-height: 1.5;
      }
      .pass { color: #6ee7a8; }
      .fail { color: #ff8b8b; }
    </style>
  </head>
  <body>
    <canvas id="view" width="256" height="256"></canvas>
    <pre id="out">running…</pre>
    <script type="module" src="./stencil.ts"></script>
  </body>
</html>
